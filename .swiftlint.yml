excluded:
  - freebnb.xcodeproj
  - functions
  - lib

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - force_unwrapping
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 700

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - to
    - db

# Xcode names the UI test target and its generated launch-test class after the
# (intentionally lowercase) product name "freebnb", not a type-style capital.
type_name:
  excluded:
    - freebnbUITests
    - freebnbUITestsLaunchTests
