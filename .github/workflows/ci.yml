name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build & test (iOS)
    runs-on: macos-15
    env:
      SCHEME: freebnb
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      # The real GoogleService-Info.plist is a secret and never committed. Firebase
      # only reads it at FirebaseApp.configure() time, and the test target boots the
      # app (it runs in the app host), so the well-formed placeholder checked in at
      # .github/ci/ is enough for the suite to launch. It never talks to a real
      # project.
      - name: Install placeholder GoogleService-Info.plist
        run: cp .github/ci/GoogleService-Info.ci.plist freebnb/GoogleService-Info.plist

      - name: Resolve simulator destination
        id: sim
        run: |
          cat > /tmp/pick_sim.py <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime in sorted(data["devices"]):
              if "iOS" not in runtime:
                  continue
              for dev in data["devices"][runtime]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator found")
          PY
          UDID=$(python3 /tmp/pick_sim.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build & test
        run: |
          xcodebuild test \
            -project freebnb.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  functions:
    name: Build (Cloud Functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Lint
        run: npm run lint

  rules-tests:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The emulator suite is a Java process. firebase-tools requires 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: npm ci --prefix rules-tests

      # These drive the rules engine directly, so unlike the emulator-tests job
      # below they need neither Xcode nor a simulator. Node is invoked by
      # absolute path because emulators:exec can shadow it with a bundled build
      # that cannot load ES modules (see rules-tests/README.md).
      - name: Run rules tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project freebnb-rules-tests \
            "cd rules-tests && $(command -v node) --test"

  emulator-tests:
    name: Firestore rules regression (emulator)
    runs-on: macos-15
    env:
      SCHEME: freebnb
      # Must match EmulatorSupport.projectID so the secondary app and the
      # emulator share a namespace.
      EMULATOR_PROJECT: freebnb-emulator-tests
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      # The emulator suite is a Java process. firebase-tools requires 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # Same placeholder as the build job: FirebaseApp.configure() reads it at
      # launch even though these tests drive a separate emulator-pointed app.
      - name: Install placeholder GoogleService-Info.plist
        run: cp .github/ci/GoogleService-Info.ci.plist freebnb/GoogleService-Info.plist

      - name: Resolve simulator destination
        id: sim
        run: |
          cat > /tmp/pick_sim.py <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime in sorted(data["devices"]):
              if "iOS" not in runtime:
                  continue
              for dev in data["devices"][runtime]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator found")
          PY
          UDID=$(python3 /tmp/pick_sim.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # emulators:exec boots Firestore + Auth, runs the command, then tears them
      # down. The simulator reaches the emulator via the host's localhost.
      #
      # The EmulatorTests test plan exists to set FREEBNB_EMULATOR_TESTS=1 in the
      # test process, which is what flips EmulatorSupport.isEnabled — so this job
      # is the only place these suites execute. The plan cannot narrow the run
      # itself (a test plan's selectedTests/skippedTests do not match Swift
      # Testing @Suite names in Xcode 16), hence the -only-testing flags; those do
      # match, and they override the plan's own selection.
      #
      # Unlike the main test job, this one must NOT disable code signing:
      # FirebaseAuth stores its session in the keychain, and SecItemAdd fails
      # with -34018 ("required entitlement isn't present") in an unsigned app.
      # Ad-hoc signing ("-") embeds the entitlements and needs no certificate.
      - name: Run emulator-backed rules tests
        run: |
          firebase emulators:exec \
            --only firestore,auth \
            --project "$EMULATOR_PROJECT" \
            "xcodebuild test \
              -project freebnb.xcodeproj \
              -scheme \"$SCHEME\" \
              -destination \"id=${{ steps.sim.outputs.udid }}\" \
              -testPlan EmulatorTests \
              -only-testing:freebnbTests/FirestoreHomesRepositoryEmulatorTests \
              -only-testing:freebnbTests/AuthEmulatorTests \
              CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO"
